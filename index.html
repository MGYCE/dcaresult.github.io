<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Results by Exam Date</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    select, table {
      margin-top: 15px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>

  <h2>DCA Course Final Result</h2>

  <label for="examDate">Select Exam Date to View Results:</label>
  <select id="examDate" onchange="showResults()">
    <option value="">--Select a Date--</option>
    <option value="29-07-2025">29-07-2025</option>
    <option value="28-07-2025">28-07-2025</option>
  </select>

  <div id="resultsContainer"></div>

  <script>
    const studentResults = {
      "29-07-2025": [
        { name: "Debajit Datta", subject: "DCA (Theory & Practical)", score: 76 },
        { name: "Krish Kumar Bin", subject: "DCA (Theory & Practical)", score: 82 }
      ],
      "28-07-2025": [
        { name: "Tamal Sarkar", subject: "DCA (Theory & Practical)", score: 78 },
      ],
    };

    function showResults() {
      const date = document.getElementById("examDate").value;
      const container = document.getElementById("resultsContainer");
      container.innerHTML = "";

      if (studentResults[date]) {
        let html = "<table><tr><th>Name</th><th>Subject</th><th>Score</th></tr>";
        studentResults[date].forEach(student => {
          html += `<tr><td>${student.name}</td><td>${student.subject}</td><td>${student.score}</td></tr>`;
        });
        html += "</table>";
        container.innerHTML = html;
      } else if (date) {
        container.innerHTML = "<p>No results found for this date.</p>";
      }
    }
  </script>

</body>
</html>
